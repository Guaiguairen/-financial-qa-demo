# ================================================================
# 评测题集：10 道测试题（其中 3 道跨公司全景题）
# 说明：
#   - type: single（单公司事实题）/ cross（跨公司全景题）
#   - k: 该题的检索候选数（全景题提高召回规模）
#   - expected_doc: 期望命中的报告（用于人工核对召回质量）
#   - ground_truth: 依据报告原文核实过的标准答案（评测时人工核对）
# ================================================================

questions:
  - id: q01
    type: single
    question: "寒武纪2025年的营业收入是多少？同比增长多少？"
    k: 8
    expected_doc: "688256_2025_annual"
    ground_truth: "营业收入 649,719.62 万元（约 64.97 亿元），同比增长 453.21%；归母净利润 205,922.85 万元（转正）。出处：年报第 2/15/26 页。"

  - id: q02
    type: single
    question: "海光信息2025年的研发投入总额是多少？占营业收入的比例是多少？"
    k: 8
    expected_doc: "688041_2025_annual"
    ground_truth: "研发投入合计 4,568,552,721.28 元（约 45.69 亿元），占营业收入 31.78%，同比增长 32.58%。出处：年报第 27 页研发投入情况表。"

  - id: q03
    type: single
    question: "澜起科技2025年互连类芯片产品线的营业收入是多少？"
    k: 8
    expected_doc: "688008_2025_annual"
    ground_truth: "互连类芯片产品线销售收入 51.39 亿元，较上年度增长 53.43%（毛利率 65.57%）。出处：年报第 46/69 页。"

  - id: q04
    type: single
    question: "龙芯中科2025年上半年实现营业收入多少？归母净利润是多少？"
    k: 8
    expected_doc: "688047_2025_semi"
    ground_truth: "营业收入 243,512,941.83 元（约 2.44 亿元），同比增长 10.90%；归母净利润 -294,468,226.53 元（亏损约 2.94 亿元）。出处：半年报第 8 页主要会计数据。"

  - id: q05
    type: single
    question: "景嘉微2025年的营业收入和归属于上市公司股东的净利润分别是多少？"
    k: 8
    expected_doc: "300474_2025_annual"
    ground_truth: "营业收入 720,064,627.80 元（约 7.20 亿元），同比增长 54.41%；归母净利润 -164,622,652.17 元（亏损约 1.65 亿元）。出处：年报第 8 页主要会计数据。"

  - id: q06
    type: single
    question: "紫光国微2025年特种集成电路业务的收入是多少？毛利率是多少？"
    k: 8
    expected_doc: "002049_2025_annual"
    ground_truth: "特种集成电路收入 3,212,013,113.91 元（约 32.12 亿元），同比 +24.63%，毛利率 70.26%。出处：年报第 14 页分产品收入及毛利率表。"

  - id: q07
    type: single
    question: "芯原股份2025年实现营业收入多少？同比增长多少？"
    k: 8
    expected_doc: "688521_2025_annual"
    ground_truth: "营业收入 31.52 亿元，同比增长 35.77%（归母净利润 -5.28 亿元）。出处：年报第 12/39 页。"

  - id: q08
    type: single
    question: "云天励飞2026年上半年营业收入和归母净利润分别是多少？"
    k: 8
    expected_doc: "688343_2026_semi"
    ground_truth: "营业收入 63,566.22 万元（约 6.36 亿元，基本持平）；归母净利润 -25,202.38 万元（亏损扩大约 4,608.56 万元）。出处：半年报第 15/33 页。"

  - id: q09
    type: cross
    question: "对比寒武纪、海光信息、澜起科技、瑞芯微四家公司2025年的营业收入规模与同比增速，哪家增速最高？"
    k: 20
    expected_doc: "688256_2025_annual / 688041_2025_annual / 688008_2025_annual / 603893_2025_annual"
    ground_truth: "寒武纪 +453.21%（64.97 亿）＞海光信息 +56.92%（143.77 亿）＞澜起科技 +49.94%（54.56 亿）＞瑞芯微 +40.36%（44.02 亿）。增速最高：寒武纪。"

  - id: q10
    type: cross
    question: "算力芯片样本公司中，2025年研发投入占营业收入比重最高的是哪家？请列出至少3家公司的研发投入比例。"
    k: 24
    expected_doc: "12 家 2025 年年报"
    ground_truth: "已核实：芯原股份 42.78%（13.49 亿 / 31.52 亿）、海光信息 31.78%、紫光国微 24.56%、寒武纪 17.99%。最高者待全量核对（重点候选：芯原、安路、龙芯、云天励飞等亏损或高投入公司）。"
